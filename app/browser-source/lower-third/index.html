<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lower Third</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1920px; height: 1080px; margin:0; padding:0; }
        body { background: transparent; overflow: hidden; font-family: 'Calibri', 'Corbel', 'Segoe UI', Arial, sans-serif; }
        #container { position: fixed; left:0; bottom:0; margin:0; padding:0; transform:none; }
        .hidden { display: none !important; }
        #bar {
            display: flex; flex-direction: column;
            border-left: 4px solid var(--stroke, #0078d4);
            background: rgba(30,30,30,0.85);
            padding: 14px 24px;
            border-radius: 0 8px 8px 0;
            margin:0;
        }
        #name { color: var(--text, #fff); font-weight: 600; }
        #event-name { color: var(--text2, #aaa); margin-top: 4px; }
    </style>
</head>
<body>
    <div id="container" class="hidden">
        <div id="bar">
            <div id="name"></div>
            <div id="event-name"></div>
        </div>
    </div>
    <script>
        const container = document.getElementById('container');
        const nameEl = document.getElementById('name');
        const eventNameEl = document.getElementById('event-name');
        let hideTimer = null;

        function apply(data, show) {
            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            if (!show) {
                container.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                container.style.transform = 'translateX(-30px)';
                container.style.opacity = '0';
                hideTimer = setTimeout(function() {
                    container.classList.add('hidden');
                    container.style.transition = '';
                    container.style.transform = '';
                    container.style.opacity = '';
                    hideTimer = null;
                }, 320);
                return;
            }

            nameEl.textContent = data.name || '';
            eventNameEl.textContent = data.eventName || (data.subtitle || '');

            const fs = (data.fontSize || 28) + 'px';
            const stroke = data.strokeColor || '#0078d4';
            const tc = data.textColor || '#ffffff';
            const alpha = Math.min(1, Math.max(0, (data.bgOpacity !== undefined ? data.bgOpacity : 85) / 100));

            nameEl.style.fontSize = fs;
            nameEl.style.color = tc;
            eventNameEl.style.fontSize = (parseInt(fs) * 0.7) + 'px';
            eventNameEl.style.color = tc;
            const bar = document.getElementById('bar');
            bar.style.setProperty('--stroke', stroke);
            bar.style.background = 'rgba(30,30,30,' + alpha + ')';
            const pad = (data.padding !== undefined && data.padding !== null) ? data.padding : 14;
            bar.style.padding = pad + 'px ' + Math.round(pad * 1.7) + 'px';
            const posX = (data.posX !== undefined && data.posX !== null) ? Number(data.posX) : 50;
            const posY = (data.posY !== undefined && data.posY !== null) ? Number(data.posY) : 90;
            container.style.setProperty('left', posX + 'px', 'important');
            container.style.setProperty('bottom', posY + 'px', 'important');
            container.style.setProperty('margin', '0', 'important');
            container.style.setProperty('padding', '0', 'important');
            // debug: log real rect, kirim ke console dan server log via fetch
            console.log('[lower-third] posX', posX, 'pad', pad, 'left CSS', container.style.left);

            container.classList.remove('hidden');
            container.style.transition = 'none';
            container.style.transform = 'translateX(-30px)';
            container.style.opacity = '0';
            container.offsetHeight;
            container.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            container.style.transform = 'translateX(0)';
            container.style.opacity = '1';

            if (data.duration > 0) {
                hideTimer = setTimeout(function() {
                    container.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    container.style.transform = 'translateX(-30px)';
                    container.style.opacity = '0';
                    hideTimer = setTimeout(function() {
                        container.classList.add('hidden');
                        container.style.transition = '';
                        container.style.transform = '';
                        container.style.opacity = '';
                        hideTimer = null;
                    }, 320);
                }, data.duration * 1000);
            }
        }

        const bc = new BroadcastChannel('obs-broadcast');
        bc.onmessage = (e) => {
            const m = e.data;
            if (m.event === 'lowerthird.show') apply(m.data || {}, true);
            if (m.event === 'lowerthird.hide') apply({}, false);
        };

        function poll() {
            fetch('../../data/lowerthird.json').then(r => r.text()).then(t => {
                try { var d = JSON.parse(t); if (d.name) apply(d, true); } catch(e) {}
            }).catch(function(){});
            fetch('../../data/status.json').then(r => r.text()).then(t => {
                try { var s = JSON.parse(t); if (!s.lowerThird) apply({}, false); } catch(e) {}
            }).catch(function(){});
        }
        setInterval(poll, 1000);
    </script>
</body>
</html>
